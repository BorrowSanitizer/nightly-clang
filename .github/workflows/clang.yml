# We need a version of `clang` that matches nightly Rust toolchain
# to ensure compatibility between Rust, Clang, and our LLVM pass plugin.
# This workflow uses Rust's nightly CI artifacts to build and distribute
# clang and its headers, without having to rebuild LLVM.
name: clang
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the release already exists
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: "clang-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      toolchain: ${{ steps.nightly.outputs.toolchain }}
      rust_sha: ${{ steps.nightly.outputs.rust_sha }}
      llvm_sha: ${{ steps.nightly.outputs.llvm_sha }}
      nightly_date: ${{ steps.nightly.outputs.nightly_date }}
      # the name of the release tag
      tag: ${{ steps.nightly.outputs.tag }}
      # a slash-free form of the tag, for artifact and file names
      artifact_prefix: ${{ steps.nightly.outputs.artifact_prefix }}
      should_build: ${{ steps.nightly.outputs.should_build }}
    steps:
      - name: Fetch nightly release info
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          base=https://static.rust-lang.org/dist
          nightly_date=$(curl -sSfL "$base/channel-rust-nightly-date.txt")
          rust_sha=$(curl -sSfL "$base/$nightly_date/channel-rust-nightly-git-commit-hash.txt")
          llvm_sha=$(gh api "repos/rust-lang/rust/contents/src/llvm-project?ref=$rust_sha" --jq .sha)
          tag="clang/${llvm_sha:0:7}"

          if [ "$FORCE" = "true" ] || ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            should_build=true
          else
            should_build=false
          fi
          {
            echo "toolchain=nightly-$nightly_date"
            echo "rust_sha=$rust_sha"
            echo "llvm_sha=$llvm_sha"
            echo "nightly_date=$nightly_date"
            echo "tag=$tag"
            echo "artifact_prefix=clang-${llvm_sha:0:7}"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: init
    if: needs.init.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lld
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh ${{ needs.init.outputs.llvm_sha }} ${{ needs.init.outputs.rust_sha }} ${{ matrix.config.target }} ${{ needs.init.outputs.artifact_prefix }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.init.outputs.artifact_prefix }}-${{ matrix.config.target }}
          path: ${{ needs.init.outputs.artifact_prefix }}-${{ matrix.config.target }}.tar.xz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish rolling release
    needs: [init, build]
    if: needs.init.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Unzip doubly-compressed artifacts
        run: |
          find . -name "*.zip" -exec unzip -o -d . {} \;
          find . -name "*.tar.xz"
          ls -la

      - name: Publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.tar.xz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi
          llvm_sha="${{ needs.init.outputs.llvm_sha }}"
          release_url=$(gh release create "${{ needs.init.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Clang (${llvm_sha:0:7})" \
            --notes "A build of clang that uses the same version of LLVM as nightly Rust." \
            --prerelease \
            "${files[@]}")

  update:
    name: Open toolchain update PR
    needs: [init, release]
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Update config.toml
        run: |
          set -euo pipefail
          sed -i -E "s|^([[:space:]]*rustc_sha[[:space:]]*=[[:space:]]*).*|\1\"${{ needs.init.outputs.rust_sha }}\"|" config.toml
          sed -i -E "s|^([[:space:]]*llvm_sha[[:space:]]*=[[:space:]]*).*|\1\"${{ needs.init.outputs.llvm_sha }}\"|" config.toml
      - name: Open PR
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          branch="toolchain/${{ needs.init.outputs.toolchain }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "${{ needs.init.outputs.toolchain }}"
          git push --force origin "$branch"
          gh pr create --head "$branch" \
            --title "Update to  ${{ needs.init.outputs.toolchain }}." \
            --body "Updates the Rust toolchain to \`${{ needs.init.outputs.toolchain }}\` using our compatible distribution of clang."
