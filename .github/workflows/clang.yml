# We need a version of `clang` that matches nightly Rust
# to ensure compatibility between Rust, Clang, and our LLVM pass plugin.
# This workflow uses Rust's nightly CI artifacts to build and distribute
# clang and its headers, without having to rebuild LLVM.
name: clang
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "clang-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      toolchain: ${{ steps.nightly.outputs.toolchain }}
      rust_sha: ${{ steps.nightly.outputs.rust_sha }}
      llvm_sha: ${{ steps.nightly.outputs.llvm_sha }}
      # the name of the release artifact
      tag: ${{ steps.nightly.outputs.tag }}
      # a slash-free form of the tag, for artifact and file names
      artifact_prefix: ${{ steps.nightly.outputs.artifact_prefix }}
      nightly_date: ${{ steps.nightly.outputs.nightly_date }}
    steps:
    - name: Fetch nightly release info
      id: nightly
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        base=https://static.rust-lang.org/dist
        nightly_date=$(curl -sSfL "$base/channel-rust-nightly-date.txt")
        rust_sha=$(curl -sSfL "$base/$nightly_date/channel-rust-nightly-git-commit-hash.txt")
        llvm_sha=$(gh api "repos/rust-lang/rust/contents/src/llvm-project?ref=$rust_sha" --jq .sha)
        {
          echo "toolchain=nightly-$nightly_date"
          echo "rust_sha=$rust_sha"
          echo "llvm_sha=$llvm_sha"
          echo "nightly_date=$nightly_date"
          echo "tag=clang/${llvm_sha:0:9}"
          echo "artifact_prefix=clang-${llvm_sha:0:9}-$nightly_date"
        } >> "$GITHUB_OUTPUT"
  build:
    needs: init
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lld
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh ${{ needs.init.outputs.llvm_sha }} ${{ needs.init.outputs.rust_sha }} ${{ matrix.config.target }} ${{ needs.init.outputs.artifact_prefix }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.init.outputs.artifact_prefix }}-${{ matrix.config.target }}
          path: ${{ needs.init.outputs.artifact_prefix }}-${{ matrix.config.target }}.tar.xz
          if-no-files-found: error
          retention-days: 1
  release:
    name: Update rolling release
    needs: [init, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        id: artifact_download
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Unzip doubly-compressed artifacts
        run: |
          find . -name "*.zip" -exec unzip -o -d . {} \;
          find . -name "*.tar.xz"
          ls -la

      - name: Delete matching rolling release (if it exists)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ needs.init.outputs.tag }}" --repo "${{ github.repository }}" --yes --cleanup-tag

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.tar.xz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi
          llvm_sha="${{ needs.init.outputs.llvm_sha }}"

          gh release create "${{ needs.init.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Clang (${llvm_sha:0:9})" \
            --notes "A build of clang that uses the same version of LLVM as nightly Rust (\`${{needs.init.outputs.toolchain}}\`)." \
            --prerelease \
            "${files[@]}"
